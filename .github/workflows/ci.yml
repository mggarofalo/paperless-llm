name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Tests (${{ matrix.os }}, .NET 10)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore --locked-mode
      - name: Install renderer for integration tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: dotnet test --no-restore --configuration Release --logger trx --tl:off
  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build release image
        run: docker build --tag ppllm:ci .
      - name: Verify non-root, read-only runtime and bundled renderer
        shell: bash
        run: |
          test "$(docker run --rm --read-only --tmpfs /tmp ppllm:ci --version)" = '0.1.0'
          docker run --rm --read-only --tmpfs /tmp ppllm:ci --help
          docker run --rm --read-only --tmpfs /tmp --mount type=volume,dst=/data/auth ppllm:ci auth status
          docker run --rm --read-only --tmpfs /tmp --mount type=volume,dst=/data/state ppllm:ci status
          docker run --rm --read-only --tmpfs /tmp --entrypoint sh ppllm:ci -c 'test "$(id -u)" != 0 && pdftoppm -v'
          docker compose --env-file .env.example config --quiet
