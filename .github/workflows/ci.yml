name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Tests (ubuntu-latest, .NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore --locked-mode
      - run: node --test runner/*.test.mjs scripts/*.test.mjs
      - name: Install complexity tooling
        run: python -m pip install -r requirements-quality.txt
      - name: Enforce maximum function complexity
        run: python scripts/complexity.py
      - name: Install renderer for integration tests
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Test with Coverlet
        run: >-
          dotnet test --no-restore --configuration Release --tl:off
          --collect:"XPlat Code Coverage" --settings coverage.runsettings
          --results-directory artifacts/coverage
      - name: Enforce module coverage floors
        run: python scripts/coverage.py artifacts/coverage
      - name: Retain test and coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-coverage
          path: artifacts/coverage/
          retention-days: 14
  container:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Container smoke test
          - os: ubuntu-24.04-arm
            name: Container smoke test (arm64)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build release image
        run: docker build --tag ppllm:ci .
      - name: Verify non-root, read-only runtime and bundled renderer
        shell: bash
        run: |
          test "$(docker run --rm --read-only --tmpfs /tmp ppllm:ci --version)" = '0.3.0'
          docker run --rm --read-only --tmpfs /tmp ppllm:ci --help
          docker run --rm --read-only --tmpfs /tmp --mount type=volume,dst=/data/auth ppllm:ci auth status
          docker run --rm --network none --read-only --tmpfs /tmp --mount type=volume,dst=/data/auth ppllm:ci models
          docker run --rm --read-only --tmpfs /tmp --mount type=volume,dst=/data/state ppllm:ci status
          docker run --rm --read-only --tmpfs /tmp --entrypoint sh ppllm:ci -c 'test "$(id -u)" != 0 && pdftoppm -v'
          docker compose --env-file .env.example config --quiet
      - name: Verify automatic organization and crash recovery
        run: bash tests/container/run.sh ppllm:ci
